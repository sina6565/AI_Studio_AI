apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    // root = file("../")
    // reactNativeDir = file("../node_modules/react-native")
    // codegenDir = file("../node_modules/@react-native/codegen")
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    // nodeExecutableAndArgs = ["node"]
    // bundleCommand = "ram-bundle"
    // bundleConfig = file("../rn-cli.config.js")
    // bundleAssetName = "MyApplication.android.bundle"
    // entryFile = file("../js/MyApplication.android.js")
    // extraPackagerArgs = []

    /* Hermes Commands */
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    // hermesFlags = ["-O", "-output-source-map"]
}

def enableProguardInReleaseBuilds = false

def releaseStoreFile = System.getenv("SINA_ANDROID_RELEASE_STORE_FILE")
def releaseStorePassword = System.getenv("SINA_ANDROID_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("SINA_ANDROID_RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("SINA_ANDROID_RELEASE_KEY_PASSWORD")

def releaseSigningConfigured =
    releaseStoreFile != null && !releaseStoreFile.trim().isEmpty() &&
    releaseStorePassword != null && !releaseStorePassword.trim().isEmpty() &&
    releaseKeyAlias != null && !releaseKeyAlias.trim().isEmpty() &&
    releaseKeyPassword != null && !releaseKeyPassword.trim().isEmpty() &&
    file(releaseStoreFile).isFile()

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.sinastudioai"
    defaultConfig {
        applicationId "com.sinastudioai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        // Let Android Gradle Plugin create/use its local developer debug key.
        // No debug keystore is committed to the repository.
        debug {
        }
        release {
            // A release artifact must never be signed with the shared debug key.
            // The release task is guarded below and requires owner-managed signing.
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    debugImplementation("com.facebook.flipper:flipper:${FLIPPER_VERSION}")
    debugImplementation("com.facebook.flipper:flipper-network-plugin:${FLIPPER_VERSION}") {
        exclude group: "com.squareup.okhttp3", module: "okhttp"
    }
    debugImplementation("com.facebook.flipper:flipper-fresco-plugin:${FLIPPER_VERSION}")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

def validateSinaReleaseSigning = tasks.register("validateSinaReleaseSigning") {
    group = "verification"
    description = "Prevents release APK/AAB creation without an owner-managed signing key."
    doLast {
        if (!releaseSigningConfigured) {
            throw new GradleException(
                "Release signing is not configured. Set SINA_ANDROID_RELEASE_STORE_FILE, " +
                "SINA_ANDROID_RELEASE_STORE_PASSWORD, SINA_ANDROID_RELEASE_KEY_ALIAS and " +
                "SINA_ANDROID_RELEASE_KEY_PASSWORD in the protected build environment."
            )
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "assembleRelease" || task.name == "bundleRelease") {
        task.dependsOn(validateSinaReleaseSigning)
    }
}
