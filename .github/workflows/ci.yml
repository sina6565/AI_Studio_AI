name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Run vertical-slice E2E (FakeProvider, no network)
        run: npm run vertical-slice
      - name: Run tests
        run: npm test -- --runInBand

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Run frontend tests
        run: npm test -- --run


  ue5-worker-contract:
    name: UE5 worker (Python syntax + gate tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate worker scripts
        run: python -m py_compile tools/ue5-room-worker/server.py tools/ue5-room-worker/build_room_from_manifest.py tools/ue5-room-worker/import_glb_to_unreal.py
      - name: Test worker approval gates
        working-directory: tools/ue5-room-worker
        run: python -m unittest discover -s . -p "test_*.py"

  mobile:
    name: Mobile (type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies (locked)
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Type-check
        run: npm run type-check
