name: Test Google Gemini API Key

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-google-api-key.yml"

permissions:
  contents: read

jobs:
  test-gemini-api:
    name: Verify Gemini API key
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check whether Google accepts the API key
        shell: bash
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_API_KEY:-}" ]]; then
            echo "::error::Secret GOOGLE_API_KEY is missing or empty."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request GET \
            "https://generativelanguage.googleapis.com/v1beta/models" \
            --header "x-goog-api-key: ${GOOGLE_API_KEY}")"

          node - "$response_file" "$http_status" <<'NODE'
          const fs = require("node:fs");
          const body = fs.readFileSync(process.argv[2], "utf8");
          const status = process.argv[3];

          let data = {};
          try { data = JSON.parse(body); } catch {}

          if (status === "200" && Array.isArray(data.models)) {
            console.log("RESULT: API KEY ACCEPTED");
            console.log("Google Gemini API authenticated successfully.");
            console.log("Available models returned:", data.models.length);
            process.exit(0);
          }

          const message = data.error?.message || "Google rejected the request; no detailed message was returned.";
          const code = data.error?.status || "UNKNOWN";
          console.error("RESULT: API KEY NOT VERIFIED");
          console.error("HTTP status:", status);
          console.error("Google error code:", code);
          console.error("Google message:", message.replace(/AIza[0-9A-Za-z_-]{20,}/g, "[REDACTED]"));
          process.exit(1);
          NODE
